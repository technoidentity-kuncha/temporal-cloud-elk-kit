name: Verify examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Java 21 examples
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: workers/java/pom.xml
      - run: mvn -B -ntp -f workers/java/pom.xml clean verify

  python:
    name: Python 3.13 and Temporal Schedule
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: workers/python/requirements.txt
      - uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0
        with:
          version: '1.5.1'
      - run: python -m pip install -r workers/python/requirements.txt
      - name: Verify local Temporal is available
        run: temporal --version
      - run: python -m unittest discover -s audit/tests -v
      - run: python -m unittest discover -s workers/python/tests -v
      - run: python -m compileall -q audit workers/python/orders workers/python/worker.py workers/python/load.py

  docs:
    name: Documentation, dashboards and Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check local documentation links
        run: python3 scripts/check_docs.py
      - name: Check generated dashboard matches source
        run: |
          python3 elk/kibana/build_dashboards.py --out "$RUNNER_TEMP/dashboards.ndjson"
          cmp elk/kibana/temporal-dashboards.ndjson "$RUNNER_TEMP/dashboards.ndjson"
      - name: Validate Compose profiles without credentials or services
        run: |
          cp .env.example .env
          docker compose --profile workers --profile sweep --profile load config --quiet
