name: Verify examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Java 21 examples
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'workers/**/pom.xml'
      - run: mvn -B -ntp -f workers/pom.xml clean verify

  python:
    name: Python 3.13 and Temporal Schedule
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'workers/python/requirements*.txt'
      - uses: temporalio/setup-temporal@84b349ed84dcd8e39888d0de0bfa01b3b897dc1d # Node 24
        with:
          version: '1.5.1'
      - run: python -m pip install -r workers/python/requirements-test.txt
      - name: Verify local Temporal is available
        run: temporal --version
      - run: python -m unittest discover -s audit/tests -v
      - run: python -m unittest discover -s workers/python/tests -v
      - run: python -m compileall -q audit workers/python/orders workers/python/worker.py workers/python/load.py

  archival:
    name: Archival E2E (Temporal + Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: archive_test
          POSTGRES_PASSWORD: archive_test
          POSTGRES_DB: archive_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U archive_test -d archive_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'workers/**/pom.xml'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            workers/python/requirements*.txt
            audit/tests/e2e/requirements.txt
      - uses: temporalio/setup-temporal@84b349ed84dcd8e39888d0de0bfa01b3b897dc1d # Node 24
        with:
          version: '1.5.1'
      - run: python -m pip install -r audit/tests/e2e/requirements.txt
      - run: python scripts/test_archival_e2e.py
        env:
          E2E_PG_DSN: postgresql://archive_test:archive_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/archive_test
      - name: Retain build and E2E logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archival-verification
          path: out/verification/archival-*.log
          retention-days: 7

  docs:
    name: Documentation, dashboards and Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/verify.yml
      - name: Check local documentation links
        run: python3 scripts/check_docs.py
      - name: Check generated dashboard matches source
        run: |
          python3 elk/kibana/build_dashboards.py --out "$RUNNER_TEMP/dashboards.ndjson"
          cmp elk/kibana/temporal-dashboards.ndjson "$RUNNER_TEMP/dashboards.ndjson"
      - name: Validate Compose profiles without credentials or services
        run: |
          cp .env.example .env
          docker compose --profile workers --profile sweep --profile load config --quiet
          docker compose -f docker-compose.yml -f docker-compose.spring.yml -f docker-compose.auth.yml --profile workers --profile sweep --profile load config --quiet
